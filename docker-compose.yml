services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgerline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledgerline_db
      POSTGRES_USER: ledgerline_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
    ports:
      - "5432:5432"
    volumes:
      - ledgerline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerline_app -d ledgerline_db"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ledgerline_pgdata:
