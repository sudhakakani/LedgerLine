spring.application.name=ledgerline
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ledgerline_db}
spring.datasource.username=${DATABASE_USERNAME:ledgerline_app}
spring.datasource.password=${DATABASE_PASSWORD:change_this_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
server.error.include-message=always
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173}
